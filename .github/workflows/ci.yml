name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  windows-rust:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check pdx-win
        shell: pwsh
        run: cargo check --locked --manifest-path tools/pdx-win/Cargo.toml

      - name: Check pdx-installer
        shell: pwsh
        run: cargo check --locked --manifest-path tools/pdx-installer/Cargo.toml

  windows-powershell:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            'install.ps1'
            'release/package-windows-release.ps1'
            'config/config.ps1'
            'config/wsl-helpers.ps1'
          )
          foreach ($script in $scripts) {
            [ScriptBlock]::Create((Get-Content -Raw -LiteralPath $script)) | Out-Null
          }

  unix-shell:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check shell scripts
        shell: bash
        run: |
          chmod +x pdx legacy/install.sh legacy/scripts/*.sh
          bash -n pdx legacy/install.sh legacy/scripts/*.sh

