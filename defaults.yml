reader: markdown
writer: pdf
pdf-engine: lualatex
template: /app/templates/pandoc.latex
highlight-style: tango

metadata:
  figureTitle: "図 "
  tableTitle: "表 "
  eqTitle: "式 "
  listingTitle: "コード "
  figPrefix:
    - "図."
    - "図."
  tblPrefix: "表."
  eqnPrefix: "式."
  lstPrefix: "コード."
  reference-section-title: "参考文献"

include-in-header:
  - "/app/preamble/preamble-main.tex"
  - "/app/preamble/preamble-chem.tex"
  - "/app/preamble/preamble-mathphys.tex"
  - "/app/preamble/preamble-tikz.tex"
  - "/app/preamble/preamble-table.tex"
  - "/app/preamble/preamble-code.tex"
  - "/app/preamble/preamble-links.tex"

variables:
  lang: ja-JP
  documentclass: ltjsarticle
  mainfont: "Noto Serif CJK JP"
  sansfont: "Noto Sans CJK JP"
  monofont: "Noto Sans Mono CJK JP"
  geometry: "top=25mm, bottom=25mm, left=20mm, right=20mm"
  fig-pos: "htbp"
